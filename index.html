<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
        <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"/>
        <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"/>
        <link rel="icon" type="image/svg+xml" href="icon.svg"/>
        <style>
            @font-face {
                font-family: 'Consolas';
                src: url('./fonts/consola.woff2') format('woff2');
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: 'Consolas';
                src: url('./fonts/consolab.woff2') format('woff2');
                font-weight: bold;
                font-style: normal;
            }
            @font-face {
                font-family: 'Consolas';
                src: url('./fonts/consolai.woff2') format('woff2');
                font-weight: normal;
                font-style: italic;
            }
            @font-face {
                font-family: 'Consolas';
                src: url('./fonts/consolaz.woff2') format('woff2');
                font-weight: bold;
                font-style: italic;
            }
            :root {
                --theme-color: #008080
            }
            html {
                color-scheme: dark;
            }
            code {
                font-family: 'Consolas', monospace !important;
            }
        </style>
    </head>
    <body class="loading sidebar-chevron-right">
        <div id="app"></div>
        <script>
            window.$docsify = {
                name: 'LitUpWay<br><small> (Python)</small>',
                loadSidebar: true,
                collapsibleSidebarGroups: true,
                notFoundPage: true,
                auto2top: true,
                autoHeader: true,
                nativeEmoji: true,
                search: {
                    noData: "未找到！",
                    placeholder: "搜索…",
                    depth: 6
                }
            };
        </script>
        <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    </body>
</html>
